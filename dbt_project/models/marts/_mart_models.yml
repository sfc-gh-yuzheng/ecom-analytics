version: 2

models:
  - name: dim_customers
    description: "Customer dimension with lifetime metrics and masked PII"
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer first name"
      - name: last_name
        description: "Customer last name"
      - name: email
        description: "Masked customer email address"
      - name: first_order_date
        description: "Date of the customer's first order"
      - name: most_recent_order_date
        description: "Date of the customer's most recent order"
      - name: number_of_orders
        description: "Total number of orders placed"
      - name: lifetime_spend
        description: "Total amount spent across all orders"
        tests:
          - not_null

  - name: fct_orders
    description: "Order fact table with payment details"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: amount
        description: "Total payment amount for the order"
        tests:
          - not_null
      - name: status
        description: "Order status"
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']

  - name: fct_customer_lifetime_value
    description: "Customer lifetime value metrics for retention campaign targeting"
    columns:
      - name: customer_id
        description: "Primary key — unique customer identifier"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: email
        description: "Masked customer email for campaign targeting"
      - name: lifetime_spend
        description: "Total spend across all orders"
        tests:
          - not_null
      - name: total_orders
        description: "Count of all orders placed"
        tests:
          - not_null
      - name: avg_order_value
        description: "Average payment amount per order"
        tests:
          - not_null
      - name: days_since_first_order
        description: "Days between first order and today"
      - name: days_since_last_order
        description: "Days between most recent order and today — churn risk indicator"
