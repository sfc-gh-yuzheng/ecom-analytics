name: Deploy dbt to Snowflake

on:
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'

jobs:
  deploy:
    name: Deploy & Build dbt Project
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_CONNECTIONS_CI_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_CI_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_CONNECTIONS_CI_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_CONNECTIONS_CI_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}
      SNOWFLAKE_CONNECTIONS_CI_ROLE: ACCOUNTADMIN
      SNOWFLAKE_CONNECTIONS_CI_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_CONNECTIONS_CI_DATABASE: ECOM_ANALYTICS
      SNOWFLAKE_CONNECTIONS_CI_SCHEMA: DBT_DEV

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          default-config-file-path: .github/snowflake-config.toml

      - name: Create target schema if not exists
        run: |
          snow sql -q "CREATE DATABASE IF NOT EXISTS ECOM_ANALYTICS;" -c ci
          snow sql -q "CREATE SCHEMA IF NOT EXISTS ECOM_ANALYTICS.DBT_DEV;" -c ci

      - name: Deploy dbt project
        run: |
          snow dbt deploy ECOM_ANALYTICS_PROJECT \
            --source dbt_project \
            --database ECOM_ANALYTICS \
            --schema DBT_DEV \
            -c ci

      - name: Execute dbt build
        run: |
          snow dbt execute -c ci \
            --database ECOM_ANALYTICS \
            --schema DBT_DEV \
            ECOM_ANALYTICS_PROJECT build

      - name: Verify deployment
        run: |
          snow dbt list --in schema DBT_DEV --database ECOM_ANALYTICS -c ci
